name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # npm provenance: the published tarball is signed by this workflow run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - name: Resolve publish decision
        id: decision
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION 已在 npm 上，跳过发布（tag 仍作发布标记）"
          elif [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库没有 NPM_TOKEN secret，跳过发布；本地已发布的版本仍可用"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.decision.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NAME: ${{ steps.decision.outputs.name }}
          VERSION: ${{ steps.decision.outputs.version }}
        run: |
          # 本地发布可能正在被 npm 异步处理（202），这里失败后再确认一次版本是否存在
          npm publish --provenance --access public || {
            code=$?
            sleep 30
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$VERSION 已存在（可能由本地发布），视为成功"
              exit 0
            fi
            exit $code
          }
